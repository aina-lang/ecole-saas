# Déploie l'API sur le VPS à chaque push sur main touchant server/ ou deploy/.
# Secrets à définir dans le dépôt (Settings › Secrets and variables › Actions) :
#   VPS_HOST     51.178.50.63
#   VPS_USER     ubuntu
#   VPS_SSH_KEY  clé privée OpenSSH autorisée sur le VPS (voir deploy/vps/README.md)
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/vps/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Déploiement sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            if [ -f ~/ecole-saas/deploy/vps/deploy-api.sh ]; then
              bash ~/ecole-saas/deploy/vps/deploy-api.sh
            else
              curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/deploy/vps/deploy-api.sh | bash
            fi
