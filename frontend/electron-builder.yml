appId: mg.sekoliko.desktop
productName: Sekoliko
copyright: © Sekoliko
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!*.pdf'
  # Exports de test et fichiers d'outillage qui traînaient à la racine et
  # partaient dans app.asar — l'installateur publié embarquait notamment un
  # export Excel d'élèves. Seuls out/, resources/ et node_modules servent à
  # l'exécution.
  - '!*.{xlsx,docx,csv}'
  - '!*.tsbuildinfo'
  - '!{components.json,shadcn.md,postcss.config.js,tailwind.config.js,yarn.lock}'
asarUnpack:
  - resources/**
# Pose les fuses Electron sur l'exécutable (RunAsNode, --inspect, NODE_OPTIONS
# désactivés) — voir build/after-pack.cjs.
afterPack: build/after-pack.cjs
win:
  executableName: Sekoliko
  icon: build/icon.ico
  # Un seul installateur pour Windows 64 et 32 bits (l'installeur choisit).
  target:
    - target: nsis
      arch: [x64, ia32]
    - target: portable
      arch: [x64]
nsis:
  # Bloque proprement l'installation sur Windows 7/8/8.1 (non supportés par Electron 28).
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  artifactName: Sekoliko-${version}-installateur.${ext}
  shortcutName: Sekoliko
  uninstallDisplayName: Sekoliko
  createDesktopShortcut: always
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerLanguages: [fr_FR]
  language: 1036
portable:
  artifactName: Sekoliko-${version}-portable.${ext}
mac:
  icon: build/icon.png
  notarize: false
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Education
appImage:
  artifactName: Sekoliko-${version}.${ext}
# Dépôt lu par electron-updater au démarrage de l'app (src/main/updater.ts).
# `npm run build:win` y génère latest.yml + l'installateur dans dist/ ; il
# suffit de recopier ces deux fichiers dans le dossier UPDATES_PATH du serveur
# (voir server/src/main.ts, route /updates).
#
# À passer en HTTPS dès qu'un domaine est en place : sur HTTP, un réseau
# hostile peut substituer l'installateur téléchargé.
publish:
  - provider: generic
    url: http://51.178.50.63:3000/updates
    channel: latest
npmRebuild: false
